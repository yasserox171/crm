# =============================================================================
# crm.centrefocus.ma — CRM interne du Centre Focus (dépôt /home/ubuntu/CRM,
# docker-compose.yml, projet « focus-crm »).
#
# Le CRM (React + API Django) est servi par son propre Nginx, conteneur
# focus-crm-web-1, qui écoute sur 172.17.0.1:8200 (passerelle docker0).
# Certificat Let's Encrypt dédié (webroot docker/certbot), renouvelé par
# certbot-renew.timer avec les autres.
# =============================================================================

upstream focus_crm_site {
    server 172.17.0.1:8200;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP : challenge ACME conservé, tout le reste redirigé en HTTPS.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name crm.centrefocus.ma;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS : proxy vers le Nginx du CRM (React + /api + /admin + /media).
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name crm.centrefocus.ma;

    ssl_certificate     /etc/letsencrypt/live/crm.centrefocus.ma/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.centrefocus.ma/privkey.pem;

    # Images et vidéos de la bibliothèque de contenu (50 Mo max côté Django).
    client_max_body_size 60m;

    location / {
        proxy_pass http://focus_crm_site;
        include /etc/nginx/conf.d/proxy-headers.inc;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    access_log /var/log/nginx/crm.access.log;
    error_log  /var/log/nginx/crm.error.log;
}
