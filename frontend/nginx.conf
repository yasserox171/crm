# Keep the scheme set by an outer HTTPS reverse proxy, otherwise use our own.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Videos for the content library can be large.
  client_max_body_size 60m;
  server_tokens off;

  # Note: an add_header inside a location would drop these, so locations
  # below use "expires" for caching instead.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "same-origin" always;

  location ~ ^/(api|admin|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
  }

  # Uploaded images/videos (shared read-only volume).
  location /media/ {
    alias /srv/media/;
    expires 7d;
  }

  # Fingerprinted build assets can be cached forever.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app: unknown paths fall back to index.html.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
