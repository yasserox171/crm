# Local development: only PostgreSQL runs in Docker; Django and Vite run on the host.
#   docker compose -f docker-compose.dev.yml up -d
name: focus-crm-dev

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: focus_crm
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus
    ports:
      - "127.0.0.1:${DEV_DB_PORT:-5440}:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dev_pgdata:
